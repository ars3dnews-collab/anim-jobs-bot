name: Animation Jobs Bot

on:
  schedule:
    # Стучимся часто. Это НЕ расписание постов: ритм держит сам бот по
    # времени прошлой публикации (POST_EVERY_MINUTES и ACTIVE_HOURS в
    # config.py). GitHub пропускает большинство срабатываний и заводит
    # задание раз в 1-3 часа — для проверки таблицы этого с запасом хватает.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, что нашлось, ничего не публиковать"
        type: boolean
        default: false
      force:
        description: "Публиковать сейчас: не ждать паузу и не смотреть на ночь"
        type: boolean
        default: false

permissions:
  contents: write

# Если запуск залип, следующий его просто убивает и работает сам.
# Очередь не копится, заблокировать канал невозможно.
concurrency:
  group: anim-jobs-bot
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "anim-jobs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish jobs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: ${{ !cancelled() }}
        run: |
          git add posted.json
          git diff --staged --quiet && exit 0
          git commit -m "update posted jobs"
          git pull --rebase --autostash
          git push
